<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1120" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Masuk — Pakani</title>
  
  <!-- Script Cek Tema Awal -->
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
</head>
<body>
  
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <div class="auth-logo">
        <i class="fa-solid fa-shrimp"></i>
      </div>

      <h1 class="auth-title">Selamat Datang</h1>
      <p class="auth-subtitle">Masuk untuk mengelola tambak Anda</p>

      <form id="login-form">
        <label class="field">
          <span>Email</span>
          <input type="email" id="email" required autocomplete="email" placeholder="nama@email.com" />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        
        <button type="submit" id="btn-submit" class="btn-primary" style="margin-top: 1.5rem;">Masuk Sistem</button>
        <p id="msg" class="msg" style="color: var(--red); margin-top: 1rem; font-weight: 600; text-align: center;"></p>
      </form>

      <p class="auth-link">Belum punya akun? <a href="/register.html">Daftar Sekarang</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const btnSubmit = document.getElementById("btn-submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      btnSubmit.classList.add("btn-loading");
      btnSubmit.disabled = true;
      
      const body = {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      };

      const res = await fetch("/api/v1/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const err = await res.json();
        let errorMsg = "Login gagal";
        if (typeof err.detail === "string") errorMsg = err.detail;
        else if (Array.isArray(err.detail)) errorMsg = "Format email atau password salah.";
        
        msg.textContent = errorMsg;
        btnSubmit.classList.remove("btn-loading");
        btnSubmit.disabled = false;
        return;
      }

      const data = await res.json();
      localStorage.setItem("token", data.access_token);
      window.location.href = "/dashboard.html";
    });
  </script>
</body>
</html>
