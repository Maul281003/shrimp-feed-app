<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1120" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Daftar — Pakani</title>
  
  <!-- Script Cek Tema Awal -->
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
</head>
<body>
  
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <div class="auth-logo" style="transform: rotate(5deg); background: linear-gradient(135deg, var(--sand), #F97316); box-shadow: 0 10px 25px rgba(245, 158, 11, 0.5);">
        <i class="fa-solid fa-user-plus"></i>
      </div>

      <h1 class="auth-title">Buat Akun</h1>
      <p class="auth-subtitle">Bergabunglah dengan ekosistem Pakani</p>

      <form id="register-form">
        <label class="field">
          <span>Nama Lengkap</span>
          <input type="text" id="full_name" required placeholder="Nama Anda" />
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" id="email" required autocomplete="email" placeholder="nama@email.com" />
        </label>
        <label class="field">
          <span>Nomor HP (Opsional)</span>
          <input type="tel" id="phone" placeholder="0812xxxxxx" />
        </label>
        <label class="field">
          <span>Password (Min 6 karakter)</span>
          <input type="password" id="password" required minlength="6" placeholder="••••••••" />
        </label>
        
        <button type="submit" id="btn-submit" class="btn-primary" style="margin-top: 1.5rem;">Daftar Akun</button>
        <p id="msg" class="msg" style="color: var(--red); margin-top: 1rem; font-weight: 600; text-align: center;"></p>
      </form>

      <p class="auth-link">Sudah punya akun? <a href="/login.html">Masuk</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById("register-form");
    const msg = document.getElementById("msg");
    const btnSubmit = document.getElementById("btn-submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      btnSubmit.classList.add("btn-loading");
      btnSubmit.disabled = true;
      
      const body = {
        full_name: document.getElementById("full_name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim() || null,
        password: document.getElementById("password").value,
      };

      const res = await fetch("/api/v1/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (res.ok) {
        window.location.href = "/login.html";
      } else {
        const err = await res.json();
        let errorMsg = "Pendaftaran gagal";
        if (typeof err.detail === "string") errorMsg = err.detail;
        else if (Array.isArray(err.detail)) errorMsg = "Email tidak valid atau password terlalu pendek.";
        
        msg.textContent = errorMsg;
        btnSubmit.classList.remove("btn-loading");
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
